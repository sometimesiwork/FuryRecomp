# SR configuration for Fury of the Furries (FURY.EXE).

# The executable is a real mode (16-bit) MZ program, not an LE/LX one.
real_mode=yes

# Paragraph the image is loaded at. The same value is used by the DOS machine in
# Dos/WHPX (Pc.ImageSegment), so both sides can be compared at the same
# addresses: image offset 0 is at 0x0207 * 16 = 0x2070.
load_segment=0x0207
